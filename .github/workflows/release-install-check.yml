name: release install check

on:
  push:
    branches:
      - main
    paths:
      - Formula/linea.rb
      - Makefile
      - .github/workflows/release-install-check.yml
  pull_request:
    paths:
      - Formula/linea.rb
      - Makefile
      - .github/workflows/release-install-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup tap
        run: |
          brew tap palmshed/linea https://github.com/palmshed/linea
          git -C "$(brew --prefix)/Library/Taps/palmshed/homebrew-linea" pull --ff-only

      - name: Override formula for PR
        if: github.event_name == 'pull_request'
        run: |
          cp Formula/linea.rb "$(brew --prefix)/Library/Taps/palmshed/homebrew-linea/Formula/linea.rb"

      - name: Install and test
        run: |
          if brew list --formula palmshed/linea/linea >/dev/null 2>&1; then \
            brew upgrade palmshed/linea/linea || test "$(brew outdated --quiet palmshed/linea/linea)" = ""; \
          else \
            brew install palmshed/linea/linea; \
          fi
          brew link --overwrite palmshed/linea/linea
          brew trust palmshed/linea 2>/dev/null || true
          HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew test palmshed/linea/linea
          $(brew --prefix palmshed/linea/linea)/bin/linea -version
